name: Release

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry Run (preview versions, build and pack — no push, no publish)'
        required: true
        type: boolean
        default: false
      releaseType:
        description: 'Release Type'
        required: true
        type: choice
        default: 'stable'
        options:
          - stable
          - beta
          - alpha
          - patch
          - minor
          - major
      publishOnly:
        description: 'Publish only (skip versioning — retry a publish that failed after the bump)'
        required: true
        type: boolean
        default: false

# Only the packages scripts/release.mjs publishes. Nx bumps versions, writes
# changelogs, tags and creates the GitHub releases; scripts/release.mjs then
# rewrites the manifests into their publishable shape and publishes to npm.
env:
  RELEASE_PROJECTS: '@mukti/api,@mukti/web,muktiai'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push commits and tags
      issues: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # scripts/release.mjs needs Node >= 20.11; registry-url writes the .npmrc
      # that reads NODE_AUTH_TOKEN.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: bun install

      - name: Version (Dry Run)
        if: ${{ inputs.dryRun && !inputs.publishOnly }}
        run: |
          FLAGS="--projects=$RELEASE_PROJECTS --skip-publish --dry-run"
          case "${{ inputs.releaseType }}" in
            stable)
              bun nx release $FLAGS
              ;;
            beta|alpha)
              bun nx release prerelease --preid=${{ inputs.releaseType }} $FLAGS
              ;;
            patch|minor|major)
              bun nx release ${{ inputs.releaseType }} $FLAGS
              ;;
          esac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Version
        if: ${{ !inputs.dryRun && !inputs.publishOnly }}
        run: |
          FLAGS="--projects=$RELEASE_PROJECTS --skip-publish"
          case "${{ inputs.releaseType }}" in
            stable)
              bun nx release $FLAGS
              ;;
            beta|alpha)
              bun nx release prerelease --preid=${{ inputs.releaseType }} $FLAGS
              ;;
            patch|minor|major)
              bun nx release ${{ inputs.releaseType }} $FLAGS
              ;;
          esac
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Push Changes
        if: ${{ !inputs.dryRun && !inputs.publishOnly }}
        run: |
          git push origin main --follow-tags
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      # Prereleases publish under their own dist-tag. scripts/release.mjs never
      # publishes under `latest` — stable versions go to `next` and are promoted
      # with `npm dist-tag add <pkg>@<version> latest`.
      - name: Publish to npm
        run: |
          case "${{ inputs.releaseType }}" in
            beta|alpha) DIST_TAG="${{ inputs.releaseType }}" ;;
            *) DIST_TAG="next" ;;
          esac
          FLAGS="--tag $DIST_TAG"
          if [[ "${{ inputs.dryRun }}" == "true" ]]; then FLAGS="$FLAGS --dry-run"; fi
          node scripts/release.mjs $FLAGS
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
