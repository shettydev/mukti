name: Release

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry Run (skip git push and publish)'
        required: true
        type: boolean
        default: false
      releaseType:
        description: 'Release Type'
        required: true
        type: choice
        default: 'stable'
        options:
          - stable
          - beta
          - alpha
          - patch
          - minor
          - major
      firstRelease:
        description: 'First release (no previous tag to diff against — generates changelogs from full history)'
        required: true
        type: boolean
        default: false

# Only the packages scripts/release.mjs publishes. Nx bumps versions, writes
# changelogs, tags and creates the GitHub releases; publishing to npm stays with
# `bun run release`, which rewrites the manifests into their publishable shape.
env:
  RELEASE_PROJECTS: '@mukti/api,@mukti/web,muktiai'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push commits and tags
      issues: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Run Release (Dry Run)
        if: ${{ inputs.dryRun }}
        run: |
          FLAGS="--projects=$RELEASE_PROJECTS --skip-publish --dry-run"
          if [[ "${{ inputs.firstRelease }}" == "true" ]]; then FLAGS="$FLAGS --first-release"; fi
          case "${{ inputs.releaseType }}" in
            stable)
              bun nx release $FLAGS
              ;;
            beta|alpha)
              bun nx release prerelease --preid=${{ inputs.releaseType }} $FLAGS
              ;;
            patch|minor|major)
              bun nx release ${{ inputs.releaseType }} $FLAGS
              ;;
          esac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Release
        if: ${{ !inputs.dryRun }}
        run: |
          FLAGS="--projects=$RELEASE_PROJECTS --skip-publish"
          if [[ "${{ inputs.firstRelease }}" == "true" ]]; then FLAGS="$FLAGS --first-release"; fi
          case "${{ inputs.releaseType }}" in
            stable)
              bun nx release $FLAGS
              ;;
            beta|alpha)
              bun nx release prerelease --preid=${{ inputs.releaseType }} $FLAGS
              ;;
            patch|minor|major)
              bun nx release ${{ inputs.releaseType }} $FLAGS
              ;;
          esac
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Push Changes
        if: ${{ !inputs.dryRun }}
        run: |
          git push origin main --follow-tags
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
